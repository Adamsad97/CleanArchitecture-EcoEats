name: Deploy (Manual & Auto)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
  workflow_run:
    workflows: ["CD"]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.1

    - name: Deploy via SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
          "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
          "set -e \
          && cd ${{ secrets.DEPLOY_PATH }} \
          && echo 'Pulling latest changes...' \
          && git pull origin main \
          && echo 'Pulling latest Docker images...' \
          && docker-compose pull \
          && echo 'Starting services...' \
          && docker-compose up -d --remove-orphans \
          && echo 'Running database migrations...' \
          && docker-compose exec -T backend npx prisma migrate deploy \
          && echo 'Cleaning up old images...' \
          && docker image prune -f \
          && echo 'Deployment completed!'"

    - name: Notify success
      if: success()
      run: |
        echo "## ✅ Déploiement réussi" >> $GITHUB_STEP_SUMMARY
        echo "| Champ | Valeur |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Environnement | \`${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Déclenché par | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Date | \`$(date -u +'%Y-%m-%d %H:%M:%S UTC')\` |" >> $GITHUB_STEP_SUMMARY

    - name: Notify failure
      if: failure()
      run: |
        echo "## ❌ Déploiement échoué" >> $GITHUB_STEP_SUMMARY
        echo "| Champ | Valeur |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Environnement | \`${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Déclenché par | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "Vérifiez les logs ci-dessus pour identifier l'erreur." >> $GITHUB_STEP_SUMMARY