name: CD

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["CI"]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'

    steps:
    - name: Checkout
      uses: actions/checkout@v4.1.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3.0.0

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3.1.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

    - name: Build and push backend
      uses: docker/build-push-action@v6.0.1
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: |
          ghcr.io/${{ github.repository }}/backend:latest
          ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.sha_short }}
        labels: |
          org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

    - name: Build and push frontend
      uses: docker/build-push-action@v6.0.1
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        tags: |
          ghcr.io/${{ github.repository }}/frontend:latest
          ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.sha_short }}
        labels: |
          org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

    - name: Summary
      run: |
        echo "## 🐳 Images publiées" >> $GITHUB_STEP_SUMMARY
        echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
        echo "| backend | \`${{ github.sha }}