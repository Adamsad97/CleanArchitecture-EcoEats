services:
  db:
    image: postgres:16
    container_name: ecoeats-db
    environment:
      POSTGRES_USER: ecoEats
      POSTGRES_PASSWORD: Damuss010197$
      POSTGRES_DB: EcoEats
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoEats -d EcoEats"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecoeats-backend
    environment:
      DATABASE_URL: postgresql://ecoEats:Damuss010197%24@db:5432/EcoEats?schema=public
      JWT_ACCESS_SECRET: ecoeats-access-secret-change-in-production
      JWT_REFRESH_SECRET: ecoeats-refresh-secret-change-in-production
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CORS_ORIGIN: http://localhost:3000
      HTTP_FRAMEWORK: express
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    command: sh -c "npm run build && npx prisma db push --schema prisma/schema.prisma && npm run start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecoeats-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}

volumes:
  postgres_data: